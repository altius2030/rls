<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Rongta RLS1000 — Выгрузка</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f5f7fa;color:#333;padding:14px}
.c{max-width:900px;margin:0 auto}
h1{color:#1a73e8;font-size:18px;margin-bottom:4px}
.sub{color:#666;font-size:12px;margin-bottom:12px}
.card{background:#fff;border-radius:8px;padding:14px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.row{display:flex;gap:8px}
.row>div{flex:1}
label{display:block;font-size:11px;color:#555;margin-bottom:3px;font-weight:500}
input{width:100%;padding:7px;border:1px solid #ddd;border-radius:4px;font-size:12px;margin-bottom:6px}
button{padding:9px 16px;border:0;border-radius:4px;cursor:pointer;font-size:12px;font-weight:500;margin-right:6px;margin-bottom:6px}
.b1{background:#1a73e8;color:#fff}
.b1:disabled{background:#a0c4f0;cursor:not-allowed}
.b2{background:#137333;color:#fff}
.st{padding:7px 10px;border-radius:4px;margin-top:8px;font-size:11px;display:none}
.st.s{background:#e6f4ea;color:#137333;display:block}
.st.e{background:#fce8e6;color:#c5221f;display:block}
.st.l{background:#e8f0fe;color:#1a73e8;display:block}
table{width:100%;border-collapse:collapse;font-size:10px;margin-top:8px}
th,td{padding:4px 6px;text-align:left;border-bottom:1px solid #eee;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:180px}
th{background:#f8f9fa;font-weight:600;position:sticky;top:0}
.pw{max-height:400px;overflow-y:auto;border:1px solid #eee;border-radius:4px}
.bdg{display:inline-block;padding:2px 5px;border-radius:7px;font-size:10px}
.bdg-p{background:#e8f0fe;color:#1a73e8}
.meta{display:flex;gap:12px;margin-top:8px;flex-wrap:wrap}
.meta span{font-size:11px;color:#666}
.meta strong{color:#333}
</style>
</head>
<body>
<div class="c">
<h1>⚖️ Rongta RLS1000 — Выгрузка PLU</h1>
<p class="sub">PLU = код товара | Весовой штрих-код генерируется автоматически</p>

<div class="card">
<h2 style="font-size:13px;margin-bottom:8px">Параметры</h2>
<div class="row">
<div><label>Префикс весового штрихкода (20-29)</label>
<input type="number" id="prefix" value="20" min="20" max="29"></div>
<div><label>Начальный отдел</label>
<input type="number" id="dept" value="1" min="1" max="99"></div>
</div>
<button class="b1" id="btnLoad" onclick="loadProducts()">📋 Загрузить товары</button>
<button class="b2" id="btnExport" onclick="exportTXP()" disabled>📥 Скачать TXP</button>
<a href="/download/rongta_send.py" class="b1" style="text-decoration:none;display:inline-block;padding:9px 16px;border-radius:4px;font-size:12px;">📥 Скрипт для ПК</a>
<div class="st" id="st"></div>
</div>

<div class="card" id="resCard" style="display:none">
<h2 style="font-size:13px;margin-bottom:8px">
Товары <span class="bdg bdg-p" id="cnt">0</span>
</h2>
<div class="meta" id="meta"></div>
<div class="pw" id="tw" style="margin-top:8px"></div>
</div>
</div>

<script>
let products=[];
function st(t,x){const e=document.getElementById('st');e.className='st '+t;e.textContent=x}
function nh(){try{window.parent.postMessage({name:'EventMessage',height:document.body.scrollHeight},'*')}catch(e){}}

async function loadProducts(){
document.getElementById('btnLoad').disabled=true;
st('l','Загрузка товаров...');
try{
const r=await fetch('/api/products');
const d=await r.json();
if(d.error){st('e','Ошибка: '+d.error);console.log(d);return}
if(d._debug){console.log('DEBUG:',d._debug);}
products=d.products||[];
if(!products.length){st('e','Товары не найдены. Debug: '+JSON.stringify(d._debug||{}));return}
displayProducts();
}catch(e){st('e','Ошибка сети: '+e.message)}finally{document.getElementById('btnLoad').disabled=false}
}

function displayProducts(){
const deptStart=parseInt(document.getElementById('dept').value)||1;
document.getElementById('resCard').style.display='block';
document.getElementById('cnt').textContent=products.length;
const wg=products.filter(p=>p.isWeighed).length,bc=products.filter(p=>p.barcode).length;
document.getElementById('meta').innerHTML='<span>Всего: <strong>'+products.length+'</strong></span><span>Весовых: <strong>'+wg+'</strong></span><span>Со штрихкодом: <strong>'+bc+'</strong></span>';
let html='<table><thead><tr><th>PLU</th><th>Код</th><th>Наименование</th><th>Вес.ШК</th><th>Цена</th><th>Вес</th><th>Отд.</th></tr></thead><tbody>';
products.forEach(p=>{
const wbc=genWB(p);const dept=deptStart+p.folderIndex;
html+='<tr><td>'+esc(p.code)+'</td><td>'+esc(p.code)+'</td><td title="'+esc(p.name)+'">'+esc(p.name)+'</td><td style="font-family:monospace">'+wbc+'</td><td>'+(p.price?p.price.toFixed(2):'-')+'</td><td>'+(p.weight||'-')+'</td><td>'+dept+'</td></tr>';
});
html+='</tbody></table>';
document.getElementById('tw').innerHTML=html;
document.getElementById('btnExport').disabled=false;
st('s','✅ Загружено '+products.length+' товаров');
nh();
}

function genWB(p){
if(!p.code)return '';
const px=parseInt(document.getElementById('prefix').value)||20;
let plu=(p.code||'').replace(/\D/g,'').substring(0,5).padStart(5,'0');
const base=String(px)+plu.substring(0,5);
let s=0;for(let i=0;i<base.length;i++)s+=parseInt(base[i])*(i%2===0?1:3);
return base+String((10-s%10)%10);
}

function exportTXP(){
if(!products.length){st('e','Сначала загрузите товары');return}
const px=parseInt(document.getElementById('prefix').value)||20,ds=parseInt(document.getElementById('dept').value)||1;
const l=['Hotkey\tPLU Name\tFresh Code\tDept\tPrice\tWeight\tType\tPType\tLabel\tBarcode\tFmt\tValid\tPack'];
products.forEach(p=>{
const wbc=genWB(p),kp=Math.round((p.price||0)*100),g=Math.round((p.weight||0)*1000),w=p.isWeighed?0:1;
l.push([p.code,(p.name||'').substring(0,36),(p.code||'').substring(0,6),Math.min(ds+p.folderIndex,99),kp,g,w,w===0?0:2,'0',(p.barcode||wbc).substring(0,13),'0','0','0'].join('\t'));
});
const b=new Blob([l.join('\n')],{type:'text/plain;charset=utf-8'});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download='rongta_plu_'+new Date().toISOString().slice(0,10)+'.txp';a.click();URL.revokeObjectURL(u);
st('s','✅ TXP скачан ('+products.length+'). Запустите rongta_send.py');
nh();
}

function esc(t){const d=document.createElement('div');d.textContent=t||'';return d.innerHTML}
window.addEventListener('load',nh);
</script>
</body>
</html>
